name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  GO_VERSION: "1.24"
  PHP_VERSION: "8.3"

jobs:
  # ── 1 · Placeholder scan ──────────────────────────────────────────────────
  # Gates everything else: no unfinished-work markers or hard-coded credentials.
  placeholder-scan:
    name: "1 · Placeholder Scan"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: source/tools/placeholder-scan/go.mod
      # Each tool is its own Go module, so the build runs from inside it.
      - name: Build scanner
        working-directory: source/tools/placeholder-scan
        run: go build -o /tmp/placeholder-scan .
      - name: Run scan
        run: /tmp/placeholder-scan source

  # ── 2 · Asset validator ───────────────────────────────────────────────────
  asset-validate:
    name: "2 · Asset Validator"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: source/tools/asset-validator/go.mod
      - name: Build validator
        working-directory: source/tools/asset-validator
        run: go build -o /tmp/asset-validator .
      - name: Vet
        working-directory: source/tools/asset-validator
        run: go vet ./...
      - name: Validate pack manifest schema
        run: python3 -c "import json; json.load(open('source/infra/swf/PACK_MANIFEST.json')); print('Manifest JSON valid')"

  # ── 3 · Emulator ──────────────────────────────────────────────────────────
  # Unit tests plus the schema guard, which applies every migration and checks
  # each column the services select against the columns the migrations define.
  emulator:
    name: "3 · Emulator (Java)"
    runs-on: ubuntu-24.04
    needs: [placeholder-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: source
        run: ./gradlew :emulator:test --no-daemon
      - name: Coverage floor
        working-directory: source
        run: ./gradlew :emulator:jacocoTestCoverageVerification --no-daemon
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-reports
          path: |
            source/apps/emulator/build/reports/tests/
            source/apps/emulator/build/reports/jacoco/

  # ── 4 · Wired conformance ─────────────────────────────────────────────────
  # Chapter 59.1 gate. Gradle fails the task on any test failure, so a green
  # job is a 100% pass rate by construction.
  wired-conformance:
    name: "4 · Wired Conformance (100%)"
    runs-on: ubuntu-24.04
    needs: [emulator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Run conformance suite
        working-directory: source
        run: ./gradlew :wired-conformance:test --no-daemon
      - name: Coverage floor
        working-directory: source
        run: ./gradlew :wired-conformance:jacocoTestCoverageVerification --no-daemon
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wired-conformance-reports
          path: source/tests/wired-conformance/build/reports/

  # ── 5 · Client lint and types ─────────────────────────────────────────────
  client-lint:
    name: "5 · Client Lint + Types"
    runs-on: ubuntu-24.04
    needs: [placeholder-scan]
    steps:
      - uses: actions/checkout@v4
      # Version comes from the packageManager field in package.json; passing
      # it here as well makes the action fail with a conflict.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Install
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: source
        run: pnpm --filter @habnut/client run typecheck
      - name: Lint
        working-directory: source
        run: pnpm --filter @habnut/client run lint

  # ── 6 · Client tests ──────────────────────────────────────────────────────
  client-test:
    name: "6 · Client Unit Tests"
    runs-on: ubuntu-24.04
    needs: [client-lint]
    steps:
      - uses: actions/checkout@v4
      # Version comes from the packageManager field in package.json; passing
      # it here as well makes the action fail with a conflict.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Install
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: source
        run: pnpm --filter @habnut/client run test

  # ── 7 · Client build ──────────────────────────────────────────────────────
  client-build:
    name: "7 · Client Build"
    runs-on: ubuntu-24.04
    needs: [client-test]
    steps:
      - uses: actions/checkout@v4
      # Version comes from the packageManager field in package.json; passing
      # it here as well makes the action fail with a conflict.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Install
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: source
        run: pnpm --filter @habnut/client run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: source/apps/client/dist/

  # ── 8 · CMS lint ──────────────────────────────────────────────────────────
  cms-lint:
    name: "8 · CMS Lint"
    runs-on: ubuntu-24.04
    needs: [placeholder-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd
          coverage: none
      - name: Install
        working-directory: source/apps/cms
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Lint
        working-directory: source/apps/cms
        run: vendor/bin/pint --test

  # ── 9 · CMS tests ─────────────────────────────────────────────────────────
  # phpunit.xml pins the suite to an in-memory SQLite database, so no service
  # container is needed and every run starts from a known-empty schema.
  cms-test:
    name: "9 · CMS Tests"
    runs-on: ubuntu-24.04
    needs: [cms-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd
          coverage: none
      # The handover ticket is the one thing the website and the hotel have to
      # agree on exactly, and the agreement is a Redis key. A faked client
      # cannot see the prefix the connector adds underneath it — which is how
      # the site came to write a key the hotel could not find — so the test
      # that checks it needs a real server to read back from.
      - name: Start Redis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          redis-server --port 6399 --daemonize yes --save '' --appendonly no
          for i in $(seq 1 20); do
            redis-cli -p 6399 ping >/dev/null 2>&1 && break
            sleep 1
          done
          redis-cli -p 6399 ping
      - name: Install
        working-directory: source/apps/cms
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Test
        working-directory: source/apps/cms
        run: vendor/bin/phpunit
      - name: Dependency audit
        working-directory: source/apps/cms
        run: composer audit --no-interaction

  # ── 10 · Launcher ─────────────────────────────────────────────────────────
  # Built for both targets it ships to. The payload package is exercised in
  # its unbundled form here; a release build is produced by
  # source/scripts/build-launcher.sh, which needs the other components present.
  launcher:
    name: "10 · Launcher (Go)"
    runs-on: ubuntu-24.04
    needs: [placeholder-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: source/apps/launcher/go.sum
      - name: Vet
        working-directory: source/apps/launcher
        run: go vet ./...
      - name: Test
        working-directory: source/apps/launcher
        run: go test ./...
      - name: Build for Linux
        working-directory: source/apps/launcher
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/habnutctl-linux .
      - name: Build for Windows
        working-directory: source/apps/launcher
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/habnutctl.exe .
      - name: Vet Windows build
        working-directory: source/apps/launcher
        run: GOOS=windows go vet ./...

  # ── 11 · Prometheus rules ─────────────────────────────────────────────────
  prometheus-lint:
    name: "11 · Prometheus Rules"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          VERSION=2.53.2
          curl -fsSL -o prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${VERSION}/prometheus-${VERSION}.linux-amd64.tar.gz"
          tar xzf prometheus.tar.gz
          sudo mv "prometheus-${VERSION}.linux-amd64/promtool" /usr/local/bin/
      - name: Check rules
        run: promtool check rules source/infra/prometheus/rules/habnut.yml
      - name: Check config
        run: promtool check config source/infra/prometheus/prometheus.yml

  # ── 12 · Nginx config ─────────────────────────────────────────────────────
  nginx-config:
    name: "12 · Nginx Config"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # habnut.conf is a template: it carries a ${HABNUT_DOMAIN} placeholder and
      # points at certificate paths that only exist once Certbot has run. Both
      # are supplied here so nginx -t validates the real syntax rather than
      # being waved through.
      - name: Render template and generate a certificate
        run: |
          mkdir -p rendered/certs
          sed 's/${HABNUT_DOMAIN}/ci.habnut.test/g' source/infra/nginx/habnut.conf > rendered/habnut.conf
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout rendered/certs/privkey.pem \
            -out rendered/certs/fullchain.pem \
            -subj "/CN=ci.habnut.test" 2>/dev/null
      - name: Test config syntax
        run: |
          # proxy_pass and fastcgi_pass name Docker Compose services, which
          # nginx resolves at start-up. They are mapped to loopback so the
          # check validates syntax rather than failing on DNS.
          docker run --rm \
            --add-host emulator:127.0.0.1 \
            --add-host cms:127.0.0.1 \
            --add-host imager:127.0.0.1 \
            -v "$PWD/rendered/habnut.conf:/etc/nginx/conf.d/habnut.conf:ro" \
            -v "$PWD/rendered/certs:/etc/letsencrypt/live/ci.habnut.test:ro" \
            nginx:1.27-alpine nginx -t
      # `habnutctl dev` generates its own, simpler config. A syntax error in it
      # means `dev up` fails on somebody's own machine, which is the one place
      # nobody is watching a build log.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: source/apps/launcher/go.sum
      - name: Generate the local stack
        working-directory: source/apps/launcher
        run: go run . dev config --dir "$RUNNER_TEMP/local"
      - name: Test the local config syntax
        run: |
          docker run --rm \
            --add-host emulator:127.0.0.1 \
            --add-host cms:127.0.0.1 \
            -v "$RUNNER_TEMP/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
      - name: Validate the local compose file
        run: docker compose -f "$RUNNER_TEMP/local/docker-compose.yml" config --quiet

  # ── 13 · Docker Compose ───────────────────────────────────────────────────
  docker-compose:
    name: "13 · Docker Compose Validate"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: docker compose -f source/infra/docker/docker-compose.yml config --quiet

  # ── 14 · Release binaries ─────────────────────────────────────────────────
  # Proves the shipping artefact still assembles: the emulator JAR, the client
  # bundle and the CMS tree packed into one executable per platform.
  release-binaries:
    name: "14 · Release Binaries"
    runs-on: ubuntu-24.04
    needs: [emulator, client-build, cms-test, launcher]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      # Version comes from the packageManager field in package.json; passing
      # it here as well makes the action fail with a conflict.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: source/apps/launcher/go.sum
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd
          coverage: none
      - name: Install client dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Build release binaries
        run: source/scripts/build-launcher.sh
      - name: Verify the payload extracts
        working-directory: source/apps/launcher
        run: go test -tags bundled ./internal/payload/
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: habnutctl
          path: bin/habnutctl-*
          retention-days: 14

  # ── 15 · Migrations on MariaDB ────────────────────────────────────────────
  # The schema tests apply the migration files to H2 through a harness, which
  # proves the SQL is right but never exercises the thing that applies it on a
  # real hotel. Three faults got through that gap, each only visible against
  # MariaDB: backslash escapes meaning different things, CHANGE COLUMN setting
  # a type on one engine and not the other, and MariaDB refusing to rename a
  # column a foreign key depends on inside a combined ALTER.
  #
  # So this runs the real jar, with the real Flyway, against the same MariaDB
  # the local edition uses, and then applies the seeds on top — the exact path
  # `habnutctl dev up` takes.
  mariadb-migrations:
    name: "15 · Migrations on MariaDB"
    runs-on: ubuntu-24.04
    needs: [emulator]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: habnut
          MARIADB_DATABASE: habnut
          MARIADB_USER: habnut
          MARIADB_PASSWORD: habnut
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      # The runner has no MariaDB client of its own, so every step below that
      # queries the database exited 127 and the job went red without having
      # checked anything. It looked like a schema failure twice over.
      - name: Install the MariaDB client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb --version
      - name: Build the emulator jar
        working-directory: source
        run: ./gradlew :emulator:jar --no-daemon
      # Flyway finds its migration resolver through the service loader, so a
      # jar that merged those files wrongly connects, finds nothing to do and
      # reports success. Counting what it discovered is what catches that.
      - name: Apply the schema with the real migrator
        working-directory: source
        env:
          DB_URL: "jdbc:mariadb://127.0.0.1:3306/habnut"
          DB_USERNAME: habnut
          DB_PASSWORD: habnut
        # pipefail, because the migrator's output is piped through tee and a
        # pipeline reports tee's exit code, not the migrator's. Without it a
        # migration that fails halfway leaves this step green and the failure
        # only surfaces in the next one.
        shell: bash
        run: |
          set -o pipefail
          java -cp apps/emulator/build/libs/habnut-emulator.jar \
            com.habnut.emulator.db.MigrationRunner 2>&1 | tee migrate.log
          grep -q "pending migrations" migrate.log || {
            echo "::error::The migrator found no migrations to apply." >&2
            exit 1
          }
      - name: Check every migration was recorded as applied
        run: |
          applied=$(mariadb -h 127.0.0.1 -P 3306 -uhabnut -phabnut -N -B habnut \
            -e "SELECT COUNT(*) FROM flyway_schema_history WHERE success = 1;")
          expected=$(ls source/apps/emulator/src/main/resources/db/migration/*.sql | wc -l)
          echo "applied=$applied expected=$expected"
          # A query that did not run leaves this empty, which would otherwise
          # fail the comparison below as a bash syntax error and read as a
          # schema fault. Say which it is.
          case "$applied" in
            ''|*[!0-9]*)
              echo "::error::Could not read flyway_schema_history." >&2
              exit 1
              ;;
          esac
          if [ "$applied" -ne "$expected" ]; then
            echo "::error::$applied of $expected migrations applied." >&2
            mariadb -h 127.0.0.1 -P 3306 -uhabnut -phabnut habnut \
              -e "SELECT version, description, success FROM flyway_schema_history ORDER BY installed_rank;"
            exit 1
          fi
      # The seeds are what the schema is for, and they are where a column that
      # drifted shows up: a rename the services do not know about fails here
      # rather than in the migration.
      - name: Apply the base seed
        run: |
          mariadb -h 127.0.0.1 -P 3306 -uhabnut -phabnut habnut \
            < source/apps/launcher/internal/seed/sql/base.sql
      - name: Apply the demo world
        run: |
          mariadb -h 127.0.0.1 -P 3306 -uhabnut -phabnut habnut \
            < source/apps/launcher/internal/seed/sql/demo.sql
      - name: Check a seeded hotel has something in it
        run: |
          for pair in "habnut_room_models 5" "habnut_items_base 10" \
                      "habnut_catalogue_offers 10" "habnut_rooms 3" \
                      "habnut_floor_items 10" "habnut_users 4"; do
            set -- $pair
            count=$(mariadb -h 127.0.0.1 -P 3306 -uhabnut -phabnut -N -B habnut \
              -e "SELECT COUNT(*) FROM $1;")
            echo "$1: $count (want at least $2)"
            if [ "$count" -lt "$2" ]; then
              echo "::error::$1 has $count rows, expected at least $2." >&2
              exit 1
            fi
          done
      # Applying a seed twice must change nothing: a hotel that has been
      # running gets brought up to a newer base seed without losing what its
      # staff changed.
      - name: Check the seeds are safe to run twice
        run: |
          before=$(mariadb -h 127.0.0.1 -P 3306 -uhabnut -phabnut -N -B habnut \
            -e "SELECT (SELECT COUNT(*) FROM habnut_rooms) + (SELECT COUNT(*) FROM habnut_users) + (SELECT COUNT(*) FROM habnut_floor_items);")
          mariadb -h 127.0.0.1 -P 3306 -uhabnut -phabnut habnut \
            < source/apps/launcher/internal/seed/sql/base.sql
          mariadb -h 127.0.0.1 -P 3306 -uhabnut -phabnut habnut \
            < source/apps/launcher/internal/seed/sql/demo.sql
          after=$(mariadb -h 127.0.0.1 -P 3306 -uhabnut -phabnut -N -B habnut \
            -e "SELECT (SELECT COUNT(*) FROM habnut_rooms) + (SELECT COUNT(*) FROM habnut_users) + (SELECT COUNT(*) FROM habnut_floor_items);")
          echo "before=$before after=$after"
          [ "$before" = "$after" ] || {
            echo "::error::Reapplying the seeds changed the hotel." >&2
            exit 1
          }
