name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"
  GO_VERSION: "1.24"
  PHP_VERSION: "8.3"
  PNPM_VERSION: "8"

jobs:
  # Step 1: Placeholder scan — must pass before any build proceeds.
  placeholder-scan:
    name: "1 · Placeholder Scan"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tools/placeholder-scan/go.mod
      - name: Build scanner
        run: go build -o /tmp/placeholder-scan ./tools/placeholder-scan
      - name: Run scan
        run: /tmp/placeholder-scan .

  # Step 2: Asset pack validation.
  asset-validate:
    name: "2 · Asset Validator"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tools/asset-validator/go.mod
      - name: Build validator
        run: go build -o /tmp/asset-validator ./tools/asset-validator
      - name: Validate manifest schema
        run: |
          python3 -c "import json,sys; json.load(open('infra/swf/PACK_MANIFEST.json'))" && echo "Manifest JSON valid"

  # Step 3: Emulator build and test.
  emulator:
    name: "3 · Emulator (Java)"
    runs-on: ubuntu-24.04
    needs: [placeholder-scan]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: habnut_test
          MARIADB_USER: habnut
          MARIADB_PASSWORD: test
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=3s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle
      - name: Build and test
        working-directory: apps/emulator
        run: ./gradlew test jacocoTestReport --no-daemon
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: habnut_test
          DB_USER: habnut
          DB_PASS: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
      - name: Coverage check
        working-directory: apps/emulator
        run: |
          ./gradlew jacocoTestCoverageVerification --no-daemon
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-coverage
          path: apps/emulator/build/reports/jacoco/

  # Step 4: Wired conformance suite — must pass 100%.
  wired-conformance:
    name: "4 · Wired Conformance (100%)"
    runs-on: ubuntu-24.04
    needs: [emulator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run conformance suite
        run: pnpm --filter @habnut/wired-conformance run test
      - name: Assert 100% pass rate
        run: |
          pnpm --filter @habnut/wired-conformance run test:coverage 2>&1 | \
            grep -E "Tests:.*failed" && { echo "Wired conformance failures — gate blocked"; exit 1; } || true

  # Step 5: Client lint and type-check.
  client-lint:
    name: "5 · Client Lint + Types"
    runs-on: ubuntu-24.04
    needs: [placeholder-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @habnut/client run typecheck
      - name: Lint
        run: pnpm --filter @habnut/client run lint

  # Step 6: Client unit tests.
  client-test:
    name: "6 · Client Unit Tests"
    runs-on: ubuntu-24.04
    needs: [client-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm --filter @habnut/client run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-coverage
          path: apps/client/coverage/

  # Step 7: Client build.
  client-build:
    name: "7 · Client Build"
    runs-on: ubuntu-24.04
    needs: [client-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @habnut/client run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: apps/client/dist/

  # Step 8: CMS lint.
  cms-lint:
    name: "8 · CMS Lint"
    runs-on: ubuntu-24.04
    needs: [placeholder-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, redis
          coverage: none
      - name: Install
        working-directory: apps/cms
        run: composer install --prefer-dist --no-progress
      - name: Lint
        working-directory: apps/cms
        run: vendor/bin/pint --test

  # Step 9: CMS tests.
  cms-test:
    name: "9 · CMS Tests"
    runs-on: ubuntu-24.04
    needs: [cms-lint]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: habnut_test
          MARIADB_USER: habnut
          MARIADB_PASSWORD: test
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, redis
          coverage: pcov
      - name: Install
        working-directory: apps/cms
        run: composer install --prefer-dist --no-progress
      - name: Test
        working-directory: apps/cms
        run: vendor/bin/phpunit --coverage-clover coverage.xml
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: habnut_test
          DB_USERNAME: habnut
          DB_PASSWORD: test
          REDIS_HOST: 127.0.0.1
          APP_KEY: base64:TEST_KEY_FOR_CI_ONLY_DO_NOT_USE_IN_PROD=
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cms-coverage
          path: apps/cms/coverage.xml

  # Step 10: Launcher build.
  launcher:
    name: "10 · Launcher (Go)"
    runs-on: ubuntu-24.04
    needs: [placeholder-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/launcher/go.mod
      - name: Build
        run: go build -o /tmp/habnutctl ./apps/launcher
      - name: Test
        run: go test ./apps/launcher/...
      - name: Vet
        run: go vet ./apps/launcher/...

  # Step 11: Prometheus rule lint.
  prometheus-lint:
    name: "11 · Prometheus Rules"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download promtool
        run: |
          wget -q https://github.com/prometheus/prometheus/releases/download/v2.45.0/prometheus-2.45.0.linux-amd64.tar.gz
          tar xzf prometheus-2.45.0.linux-amd64.tar.gz
          mv prometheus-2.45.0.linux-amd64/promtool /usr/local/bin/
      - name: Check rules
        run: promtool check rules infra/prometheus/rules/habnut.yml
      - name: Check config
        run: promtool check config infra/prometheus/prometheus.yml

  # Step 12: Nginx config test.
  nginx-config:
    name: "12 · Nginx Config"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test config syntax
        run: |
          docker run --rm \
            -v "$PWD/infra/nginx/habnut.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.24-alpine nginx -t 2>&1 || true

  # Step 13: Docker Compose validation.
  docker-compose:
    name: "13 · Docker Compose Validate"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: docker compose -f infra/docker/docker-compose.yml config --quiet

  # Step 14: Flyway migration dry-run.
  migrations:
    name: "14 · Flyway Migrations"
    runs-on: ubuntu-24.04
    needs: [placeholder-scan]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: habnut_test
          MARIADB_USER: habnut
          MARIADB_PASSWORD: test
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle
      - name: Run migrations
        working-directory: apps/emulator
        run: ./gradlew flywayMigrate --no-daemon
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: habnut_test
          DB_USER: habnut
          DB_PASS: test

  # Step 15: End-to-end tests (Playwright).
  e2e:
    name: "15 · E2E (Playwright)"
    runs-on: ubuntu-24.04
    needs: [client-build, emulator, cms-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run E2E
        run: pnpm --filter @habnut/e2e run test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: tests/e2e/test-results/
