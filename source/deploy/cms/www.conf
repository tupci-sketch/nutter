; Habnut — the website's worker pool, sized for a 4 GB server.
;
; Six workers at about 40 MB each fit the container's 384 MB with room for
; opcache. Loaded after the image's own www.conf and zz-docker.conf, so these
; settings win.

[www]
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
