# Habnut — Redis, for sessions, the hotel's handover tickets and caches.
#
# The password is given on the command line from the settings file, so it is
# not in this file.

bind 0.0.0.0
protected-mode yes
port 6379

# Only keys that expire may be evicted: sessions, tickets and cache entries
# all do, while the hotel's own sets (who is online) do not and must never be
# dropped to make room.
maxmemory 80mb
maxmemory-policy volatile-lru

# Snapshots, so a restart keeps people signed in.
save 900 1
save 300 100
appendonly no
dir /data
