##
## Habnut — Nginx configuration (container stack)
##
#
# One host serves the whole hotel:
#
#   /          the website (Laravel), which owns sign-in and the session cookie
#   /client/   the game client, a static bundle built with base=/client/
#   /ws        the websocket the client talks to the hotel over
#   /imager/   avatar and badge pictures, rendered from the installed assets
#
# Same origin throughout, which is what lets the site hand a signed-in player
# straight into the game: the ticket, the cookie, the pictures and the socket
# are all on one host, so nothing has to be opened up for them to reach each
# other.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Separate directive since nginx 1.25; the combined form is deprecated.
    http2 on;
    server_name ${HABNUT_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${HABNUT_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${HABNUT_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://${HABNUT_DOMAIN}; frame-ancestors 'none';" always;

    # The website's front controller. The game client is served from a
    # directory inside it, so one root covers both.
    root /var/www/cms/public;
    index index.php;

    client_max_body_size 50M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # The hotel itself.
    location /ws {
        proxy_pass http://emulator:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /emulator/ {
        proxy_pass http://emulator:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Avatar and badge pictures. The most repeated request the site makes, and
    # every input that changes the picture is in the URL, so they are cached
    # hard at the edge as well as inside the imager.
    location /imager/ {
        proxy_pass http://imager:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 24h;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # The game client: a single page, so anything it does not have on disk
    # falls back to its own index rather than the website's.
    location /client/ {
        alias /var/www/client/;
        try_files $uri $uri/ /client/index.html;
    }

    # Its bundles are content-hashed, so they can be cached indefinitely. A
    # prefix location rather than a regex one, because an alias in a regex
    # location has to carry the captures and this needs none.
    location /client/assets/ {
        alias /var/www/client/assets/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Everything else is the website, whose router decides what exists.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass cms:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
