# Habnut: the website (Atom CMS), the game client (Octane), its assets, and the
# game server's socket and API, all on habnut.co.uk.

resolver 127.0.0.11 valid=10s ipv6=off;

# Visitors arrive through the Cloudflare tunnel's connector on this machine;
# the visitor's own address is in CF-Connecting-IP.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;

map $http_x_forwarded_proto $hotel_https { default ""; https on; }
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name www.habnut.co.uk;
    return 301 https://habnut.co.uk$request_uri;
}

server {
    listen 80 default_server;
    server_name habnut.co.uk;
    server_tokens off;
    client_max_body_size 20M;

    root /var/www/atom/public;
    index index.php;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # The game server: its websocket and its client API share one port.
    location /emu/ {
        set $game 172.30.10.20:2096;
        rewrite ^/emu/(.*)$ /$1 break;
        proxy_pass http://$game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The client. Its settings are served from outside the build, so they
    # can change without rebuilding it.
    location /octane/configuration/ {
        alias /var/www/octane-config/;
        add_header Cache-Control "no-cache" always;
    }
    location /octane/ {
        alias /var/www/octane/;
        index index.html;
        try_files $uri $uri/ /octane/index.html;
    }
    location /octane/assets/ {
        alias /var/www/octane/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Artwork and game data: bundles, icons, badges, texts.
    location /nitro/ {
        alias /var/www/nitro/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400";
    }
    location /nitro/gamedata/ {
        alias /var/www/nitro/gamedata/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=600";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $cms 172.30.10.30:9000;
        fastcgi_pass $cms;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $hotel_https if_not_empty;
        fastcgi_read_timeout 60s;
    }

    # The client's build manifest lives in a dot-directory and must be readable.
    location ^~ /octane/.vite/ { alias /var/www/octane/.vite/; }
    location ~ /\.(?!well-known) { deny all; }
}
