// Wired 2.0 conformance suite.
//
// Chapter 59.1 makes a fully passing run of this suite the precondition for
// game work.  It asserts that every registered trigger, action, condition and
// selector exists and behaves as specified, and that variable scoping, the
// operator set, signals and the execution limiter hold.
//
// Run with:  gradle :wired-conformance:test

plugins {
    id 'java'
    id 'jacoco'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation project(':emulator')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testRuntimeOnly   'ch.qos.logback:logback-classic:1.4.11'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        showStandardStreams = false
    }
    finalizedBy jacocoTestReport
}

// The suite covers classes that live in the emulator module, so the report is
// pointed at the emulator's sources and classes rather than this module's.
jacocoTestReport {
    dependsOn test
    def emulator = project(':emulator')
    sourceDirectories.setFrom(files(emulator.sourceSets.main.java.srcDirs))
    classDirectories.setFrom(
        files(emulator.sourceSets.main.output.classesDirs).asFileTree.matching {
            include 'com/habnut/emulator/wired/**'
        }
    )
    reports {
        xml.required = true
        html.required = true
    }
}

// Chapter 59.1 gates game work on this suite. The floor keeps the wired engine
// genuinely exercised rather than merely having a suite that runs.
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    def emulator = project(':emulator')
    sourceDirectories.setFrom(files(emulator.sourceSets.main.java.srcDirs))
    classDirectories.setFrom(
        files(emulator.sourceSets.main.output.classesDirs).asFileTree.matching {
            include 'com/habnut/emulator/wired/**'
        }
    )
    violationRules {
        rule {
            element = 'CLASS'
            includes = [
                'com.habnut.emulator.wired.WiredValue',
                'com.habnut.emulator.wired.WiredExecutor',
                'com.habnut.emulator.wired.WiredSignalBus',
            ]
            limit {
                counter = 'LINE'
                minimum = 0.70
            }
        }
        // WiredDefinitions holds all 136 block implementations. Many actions
        // need a live room and its entities to run, which this suite
        // deliberately does not stand up, so its floor sits lower than the
        // engine classes around it.
        rule {
            element = 'CLASS'
            includes = ['com.habnut.emulator.wired.WiredDefinitions']
            limit {
                counter = 'LINE'
                minimum = 0.55
            }
        }
    }
}
