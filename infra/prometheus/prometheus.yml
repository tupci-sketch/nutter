global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: habnut-prod

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: habnut_emulator
    metrics_path: /metrics
    static_configs:
      - targets: ["emulator:8080"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: emulator

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: mariadb
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
