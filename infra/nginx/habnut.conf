##
## Habnut — Nginx configuration
## TLS termination, WebSocket proxy, static client serving
##

# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${HABNUT_DOMAIN};

    # TLS
    ssl_certificate     /etc/letsencrypt/live/${HABNUT_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${HABNUT_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers (Chapter 67.7)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://${HABNUT_DOMAIN}; frame-ancestors 'none';" always;

    root /usr/share/nginx/html;
    index index.html;

    # WebSocket proxy to emulator
    location /ws {
        proxy_pass http://emulator:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Emulator REST health/metrics
    location /emulator/ {
        proxy_pass http://emulator:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # CMS PHP-FPM
    location /api/ {
        try_files $uri /index.php?$query_string;
    }
    location ~ \.php$ {
        fastcgi_pass cms:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/cms/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # CMS web routes (non-API, non-ws)
    location ~ ^/(login|register|logout|2fa|profile|password|news|help|privacy|terms|dcc) {
        try_files $uri /cms-index.php?$query_string;
        fastcgi_pass cms:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/cms/public/index.php;
    }

    # SPA client (all other routes)
    location / {
        try_files $uri /index.html;
    }

    # Static assets: long cache
    location ~* \.(js|css|png|svg|ico|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Deny dot-files
    location ~ /\. {
        deny all;
    }

    client_max_body_size 50M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;
}
